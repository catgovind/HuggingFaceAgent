[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huggingface-agent"
version = "0.1.0"
description = "Hands-on Hugging Face AI Agents course work built with smolagents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Govindan Padmanaban" }]
license = { text = "MIT" }
dependencies = ["python-dotenv>=1.0.0", "huggingface_hub>=0.26.0", "smolagents>=1.26", "gradio>=6"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
